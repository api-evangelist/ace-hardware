description: >-
  Ace Hardware publishes NO API plans or pricing. There is no developer programme, no metered API
  product, and no tiered access to any endpoint, because there is no public HTTP API. This file
  records that measured zero.
plan_count: 0
plans: []
note: >-
  REPLACES A FABRICATED SCAFFOLD. Until 2026-08-30 this file carried three invented tiers (Free /
  Professional / Enterprise) with invented quotas — 1,000 requests a month, 10 requests a minute,
  100,000 on a "Professional" tier — written by the 2026-05-04 bulk sweep and marked
  `method: generated`. None of those numbers exist anywhere in Ace Hardware's published material,
  and Ace Hardware has no API to meter. The scaffold has been removed rather than carried forward.
searched:
  - url: https://www.acehardware.com/affiliates
    status: 200
    finding: >-
      Affiliate programme page. Commission rate and cookie window are not published on the page;
      it directs applicants to the Impact media-partner signup. No API pricing.
  - url: https://www.acehardware.com/affiliate-faq
    status: 200
    finding: Affiliate FAQ. No API access, no plans, no pricing.
  - url: https://www.acehardware-vendors.com/
    status: 200
    finding: >-
      Vendor portal. EDI onboarding is a contractual trading-partner relationship, not a priced
      plan. Vendors bear their own VAN/AS2 costs with their chosen EDI provider; Ace publishes no
      fee schedule.
  - url: https://www.acehardware.com/ace-trade-credit
    status: 200
    finding: >-
      Net-30 commercial trade account for pros. A credit product, not an API plan.
