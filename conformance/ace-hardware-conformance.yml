domain_standard:
  market: Retail / hardware and home improvement supply chain
  standard: ANSI ASC X12 EDI 4010 over AS2
  declared: true
  where: >-
    Ace Hardware's supplier-facing EDI specification pages and the Ace Vendor Manual, which name
    the exact X12 transaction sets, the version, the AS2 transport and the trading-partner EDI IDs.
  transaction_sets:
    - id: '850'
      name: Purchase Order
    - id: '856'
      name: Advance Ship Notice
    - id: '810'
      name: Invoice
    - id: '820'
      name: Payment Order / Remittance Advice
    - id: '864'
      name: Text Message (exception and knowledge documents)
    - id: '997'
      name: Functional Acknowledgement
    - id: '812'
      name: Credit/Debit Adjustment
      note: >-
        Named in third-party supplier-compliance write-ups as part of Ace's core document set;
        not listed on the Logicbroker specification page we read, so recorded as reported rather
        than confirmed first-party.
  machine_readable: false
  machine_readable_note: >-
    The specifications themselves are distributed as PDF mapping documents. There is no EDIFACT/X12
    schema, no JSON/XML rendering of the maps, and no API to fetch them. A partner cannot generate
    a mapping from a machine-readable artifact — this is the single biggest machine-readability gap
    in Ace Hardware's integration surface.

compliance:
  certifications: []
  note: >-
    No trust center, no SOC 2 / ISO 27001 / PCI attestation page, and no compliance program page
    was found on either host. trust.acehardware.com does not resolve. No `Compliance` pointer is
    emitted.
